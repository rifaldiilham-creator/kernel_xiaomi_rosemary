name: Build Kernel Rosemary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev zip unzip make clang lld llvm

      - name: Get Clang 12 & GCC Cross-Compilers
        run: |
          mkdir -p $HOME/clang $HOME/gcc64 $HOME/gcc32
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz
          tar -xf clang-r416183b.tar.gz -C $HOME/clang
          
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.0.0_r1/repository-g9621313.tar.gz
          tar -xf repository-g9621313.tar.gz -C $HOME/gcc64
          
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.0.0_r1/repository-g235308b.tar.gz
          tar -xf repository-g235308b.tar.gz -C $HOME/gcc32

      - name: Setup SukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/sukisu-ultra/sukisu-ultra/main/kernel/setup.sh" | bash -
          echo -e "\nCONFIG_KSU=y\nCONFIG_OVERLAY_FS=y" >> arch/arm64/configs/rosemary_defconfig

      - name: Compile
        run: |
          export PATH="$HOME/clang/bin:$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          make rosemary_defconfig
          make -j$(nproc)

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb-SukiSU
          path: arch/arm64/boot/Image.gz-dtb
          make rosemary_defconfig
          make -j$(nproc)

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb-SukiSU
          path: arch/arm64/boot/Image.gz-dtb
